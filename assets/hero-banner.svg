<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#17153b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="52%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#glow1)"/>
  <rect width="1200" height="420" rx="22" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="1.5"/>

  <!-- Top Brand Header -->
  <g transform="translate(56, 48)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0f172a" stroke="url(#accent)" stroke-width="2"/>
    <polygon points="30,10 15,28 25,28 20,42 37,24 27,24" fill="#7dd3fc"/>
    <text x="68" y="26" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="800" letter-spacing="0.4">Web Reverse Inspector</text>
    <text x="68" y="48" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="500">v2.0 · Zero-Backend Chrome MV3 · Bilingual (EN / 中文) · Web Reverse &amp; Bidirectional PPTX Engine</text>
  </g>

  <!-- 3 Feature Pipeline Cards -->
  <g transform="translate(56, 134)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="224" rx="16" fill="rgba(15,23,42,0.72)" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <rect x="20" y="20" width="112" height="24" rx="12" fill="rgba(56,189,248,0.16)"/>
    <text x="34" y="36" fill="#38bdf8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700">01 · WEB REVERSE</text>
    <text x="20" y="72" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">Full-Layer &amp; 4s Storyboard</text>
    <text x="20" y="96" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">Shadow DOM Inspector + 2x2 Motion</text>
    <text x="20" y="128" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Web Components ShadowRoot Piercing</text>
    <text x="20" y="152" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 4s Multi-Node Delta + 2x2 Storyboard</text>
    <text x="20" y="176" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Web Session Auto-Image Upload + BYOK</text>
    <text x="20" y="200" fill="#38bdf8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">Alt+Shift+I / Context Menu Ready</text>

    <!-- Arrow 1 -->
    <path d="M 352 112 L 372 112" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="370,106 380,112 370,118" fill="#38bdf8"/>

    <!-- Card 2 -->
    <rect x="386" y="0" width="340" height="224" rx="16" fill="rgba(15,23,42,0.72)" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <rect x="406" y="20" width="136" height="24" rx="12" fill="rgba(129,140,248,0.18)"/>
    <text x="418" y="36" fill="#a5b4fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700">02 · LIVE SANDBOX</text>
    <text x="406" y="72" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">1:1 HTML Preview &amp; Edit</text>
    <text x="406" y="96" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">PPTX 4-Level Parser / Custom HTML</text>
    <text x="406" y="128" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Theme -> Master -> Layout -> Slide</text>
    <text x="406" y="152" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Inline Live Text Editing &amp; Fullscreen</text>
    <text x="406" y="176" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Direct .html Paste/Drop + AI Rewrite Box</text>
    <text x="406" y="200" fill="#a5b4fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">IndexedDB History + Multi-Slide Merge</text>

    <!-- Arrow 2 -->
    <path d="M 738 112 L 758 112" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="756,106 766,112 756,118" fill="#34d399"/>

    <!-- Card 3 -->
    <rect x="772" y="0" width="316" height="224" rx="16" fill="rgba(15,23,42,0.72)" stroke="rgba(52,211,153,0.48)" stroke-width="1.4"/>
    <rect x="792" y="20" width="144" height="24" rx="12" fill="rgba(16,185,129,0.18)"/>
    <text x="804" y="36" fill="#34d399" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700">03 · NATIVE .PPTX</text>
    <text x="792" y="72" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">Lossless Editable Export</text>
    <text x="792" y="96" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">Zero-Dependency ECMA-376 Packager</text>
    <text x="792" y="128" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Editable Rich Text, Gradients &amp; Tables</text>
    <text x="792" y="152" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 2x Transparent SVG/Canvas &amp; Hybrid FX</text>
    <text x="792" y="176" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Cross-OS Safe Font Mapping &amp; Notes</text>
    <text x="792" y="200" fill="#34d399" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">PowerPoint / WPS / Keynote Ready</text>
